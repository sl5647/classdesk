<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>教务工作台</title>
<link rel="stylesheet" href="/hub.css?v=1">
</head>
<body>
<div class="wrap">
  <header class="hub-head">
    <img class="logo" src="/icon.png?v=1" width="44" height="44" alt="">
    <div class="t">
      <h1>教务工作台</h1>
      <p id="hubSub">正在加载…</p>
    </div>
  </header>

  <div class="cards">
    <a class="card" href="/files">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h5l1.7 2h8.3A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="16.2" cy="14.4" r="2.1"/><path d="M17.7 15.9 19.5 17.7"/></svg></div>
      <h2>教学文件管理</h2>
      <p>课件、考勤、结算、证书，全部收进来。全程可搜（含正文），能改名/打标签/在线改表格，还能转格式。</p>
      <div class="meta" id="metaFiles">—</div>
      <span class="go">进入 →</span>
    </a>

    <a class="card" href="/students">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.2 19c.6-3.2 3-5.2 5.8-5.2s5.2 2 5.8 5.2"/><circle cx="17.2" cy="9.4" r="2.4"/><path d="M15 19c.3-2.4 1.9-4 4-4 .7 0 1.3.2 1.9.5"/></svg></div>
      <h2>学员管理系统</h2>
      <p>学员档案、报读课程、应收实收、欠费、课时进度。报名、续费、退费都在这里记。</p>
      <div class="meta" id="metaStudents">—</div>
      <span class="go">进入 →</span>
    </a>

    <div class="card soon">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg></div>
      <h2>课程排课</h2>
      <p>按校区/班级排课、看老师时间冲突。还没做，先把学员和资料用起来。</p>
      <div class="meta">规划中</div>
    </div>

    <div class="card soon">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V19"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg></div>
      <h2>收支统计</h2>
      <p>校区收入、课时费、老师课酬汇总。等学员数据用起来再做。</p>
      <div class="meta">规划中</div>
    </div>
  </div>

  <footer class="hub-foot">
    <span>数据都在本机 · 不上传</span>
    <span id="hubVer"></span>
  </footer>
</div>
<script src="/hub.js?v=2"></script>
</body>
</html>
